name: Pages

# Publishes the user documentation (doc/de, doc/en) and the icon overview
# (pages/icons.html) to GitHub Pages. Both parts belong in ONE workflow:
# deploy-pages always replaces the whole site, so two workflows would delete
# each other's output.
on:
    push:
        branches:
            - main
        paths:
            - 'doc/**'
            - 'pages/**'
            - 'script/build-doc-page.ts'
            - 'script/build-icon-page.ts'
            - 'script/icons.json'
            - 'script/custom-icons.json'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v5
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # has to run first: the documentation build clears the output directory
            - name: Build documentation
              run: npx tsx script/build-doc-page.ts _site --strict

            - name: Build icon page
              run: npx tsx script/build-icon-page.ts _site/icons

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
